name: Deploy Zenn Stats Dashboard to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "dashboard/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Download latest zenn_stats.db.gz from GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          gh release download latest -p "zenn_stats.db.gz" -D data --clobber
          gunzip -f data/zenn_stats.db.gz

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build Observable Framework site
        working-directory: dashboard
        env:
          OBSERVABLE_TELEMETRY_DISABLE: "true"
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
